name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

jobs:
  build-pyz:
    name: Build Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Shiv
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install shiv

      - name: Build pyz
        run: shiv --site-packages . -e main:main -o data-structure.pyz

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          body: |
            **Struktur Data — UTS Genap 2025/2026**
            Ichsan Hafizd Al-Fajry · 251240001657

            ### Cara Menjalankan (Windows)
            Unduh file **`start.bat`** lalu *double-click* untuk menjalankan aplikasi secara otomatis (membutuhkan Python).
          files: |
            data-structure.pyz
            start.bat
          make_latest: true